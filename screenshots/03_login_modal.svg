<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="hdr3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="55%" style="stop-color:#0D2456"/>
      <stop offset="100%" style="stop-color:#1A56DB"/>
    </linearGradient>
    <linearGradient id="btn3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A56DB"/>
      <stop offset="100%" style="stop-color:#1348C8"/>
    </linearGradient>
  </defs>

  <!-- BG blurred -->
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <!-- Overlay -->
  <rect width="1280" height="720" fill="rgba(0,0,0,0.55)"/>

  <!-- Header (behind overlay) -->
  <rect width="1280" height="64" fill="url(#hdr3)" opacity="0.6"/>

  <!-- Auth Card -->
  <rect x="410" y="100" width="460" height="500" rx="16" fill="white"/>
  <rect x="410" y="100" width="460" height="4" rx="2" fill="#1A56DB"/>

  <!-- Brand -->
  <circle cx="444" cy="148" r="12" fill="#3b82f6"/>
  <text x="464" y="153" font-family="Arial Black,sans-serif" font-weight="900" font-size="16" fill="#0D2456">ConnectSphere</text>

  <!-- Title -->
  <text x="430" y="192" font-family="Arial Black,sans-serif" font-weight="900" font-size="24" fill="#0F1824">Welcome Back</text>
  <text x="430" y="212" font-family="Arial,sans-serif" font-size="12" fill="#6B7280">Your professional video meeting platform</text>

  <!-- Email field -->
  <text x="430" y="250" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#374151">Email Address</text>
  <rect x="430" y="258" width="400" height="42" rx="10" fill="white" stroke="#1A56DB" stroke-width="1.5"/>
  <text x="446" y="284" font-family="Arial,sans-serif" font-size="13" fill="#0F1824">janavi.jadhav@connectsphere.app</text>

  <!-- Password field -->
  <text x="430" y="324" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#374151">Password</text>
  <rect x="430" y="332" width="400" height="42" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="446" y="358" font-family="Arial,sans-serif" font-size="16" fill="#6B7280" letter-spacing="4">••••••••••</text>

  <!-- Continue button -->
  <rect x="430" y="394" width="400" height="46" rx="11" fill="url(#btn3)"/>
  <text x="630" y="422" font-family="Arial,sans-serif" font-weight="800" font-size="15" fill="white" text-anchor="middle">Continue →</text>

  <!-- Switch -->
  <text x="630" y="462" font-family="Arial,sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">New to ConnectSphere?</text>
  <text x="750" y="462" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#1A56DB">Create account</text>

  <!-- Badges -->
  <rect x="430" y="488" width="1" height="1" fill="none"/>
  <rect x="430" y="490" width="400" height="1" fill="#E5E7EB"/>

  <rect x="430" y="502" width="110" height="26" rx="13" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <text x="485" y="519" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="#6B7280" text-anchor="middle">🔒 Secure</text>

  <rect x="552" y="502" width="130" height="26" rx="13" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <text x="617" y="519" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="#6B7280" text-anchor="middle">🔑 JWT Auth</text>

  <rect x="694" y="502" width="136" height="26" rx="13" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <text x="762" y="519" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="#6B7280" text-anchor="middle">⚡ Fast &amp; Reliable</text>

  <!-- Close button -->
  <circle cx="850" cy="116" r="14" fill="#F3F4F6"/>
  <text x="850" y="122" font-family="Arial,sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">✕</text>

  <!-- Bottom label -->
  <text x="640" y="680" font-family="Arial,sans-serif" font-size="11" fill="#aaa" text-anchor="middle">🔵 ConnectSphere · Login Screen · CodeAlpha Full Stack Internship</text>
</svg>
