  <text x="917" y="116" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="#1A56DB" text-anchor="middle">🗑️ Clear</text>

  <!-- Canvas -->
  <rect x="34" y="136" width="912" height="460" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Fake drawing — curves and shapes -->
  <path d="M 80 300 Q 150 220 240 280 Q 330 340 420 260 Q 510 180 600 240 Q 680 290 750 220" stroke="#1A56DB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 100 400 Q 200 360 300 390 Q 400 420 500 380 Q 580 350 660 370" stroke="#047857" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 200 450 Q 260 410 320 440 Q 380 470 440 435 Q 500 400 560 430" stroke="#7C3AED" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Some shapes -->
  <rect x="650" y="260" width="120" height="80" rx="8" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <text x="710" y="308" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#F59E0B" text-anchor="middle">Sprint Plan</text>
  <circle cx="820" cy="380" r="50" fill="none" stroke="#EF4444" stroke-width="3"/>
  <text x="820" y="376" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="#EF4444" text-anchor="middle">Feature</text>
  <text x="820" y="392" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="#EF4444" text-anchor="middle">A</text>
  <!-- Arrow -->
  <line x1="640" y1="300" x2="770" y2="300" stroke="#1A56DB" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="770,295 782,300 770,305" fill="#1A56DB"/>

  <!-- Text annotations on canvas -->
  <text x="100" y="175" font-family="Arial,sans-serif" font-weight="700" font-size="14" fill="#0F1824">User Flow Diagram</text>
  <text x="100" y="192" font-family="Arial,sans-serif" font-size="11" fill="#6B7280">— Janavi Jadhav (drawing)</text>

  <!-- Participant tags at bottom of canvas -->
  <rect x="44" y="570" width="100" height="20" rx="10" fill="#EEF4FF"/>
  <text x="94" y="584" font-family="Arial,sans-serif" font-size="10" fill="#1A56DB" text-anchor="middle">🔵 Janavi drawing</text>
  <rect x="154" y="570" width="96" height="20" rx="10" fill="#E8F5E9"/>
  <text x="202" y="584" font-family="Arial,sans-serif" font-size="10" fill="#047857" text-anchor="middle">🟢 Kajal viewing</text>

  <!-- Sidebar hint -->
  <rect x="976" y="80" width="284" height="560" rx="14" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="996" y="116" font-family="Arial,sans-serif" font-weight="700" font-size="14" fill="#0F1824">👥 Participants</text>
  <circle cx="1004" cy="136" r="5" fill="#047857"/>
  <text x="1018" y="141" font-family="Arial,sans-serif" font-size="12" fill="#374151">Janavi Jadhav ✏️</text>
  <circle cx="1004" cy="158" r="5" fill="#047857"/>
  <text x="1018" y="163" font-family="Arial,sans-serif" font-size="12" fill="#374151">Kajal Tiwari</text>
  <circle cx="1004" cy="180" r="5" fill="#047857"/>
  <text x="1018" y="185" font-family="Arial,sans-serif" font-size="12" fill="#374151">Tejaswini Ingle</text>
  <circle cx="1004" cy="202" r="5" fill="#047857"/>
  <text x="1018" y="207" font-family="Arial,sans-serif" font-size="12" fill="#374151">Reena N.</text>
  <line x1="996" y1="220" x2="1246" y2="220" stroke="#E5E7EB" stroke-width="1"/>
  <text x="996" y="244" font-family="Arial,sans-serif" font-weight="700" font-size="14" fill="#0F1824">💬 Room Chat</text>
  <rect x="996" y="252" width="244" height="100" rx="10" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1010" y="274" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="#1348C8">Janavi Jadhav</text>
  <text x="1010" y="290" font-family="Arial,sans-serif" font-size="11" fill="#374151">Check the whiteboard! 🎨</text>
  <text x="1010" y="314" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="#1348C8">Kajal Tiwari</text>
  <text x="1010" y="330" font-family="Arial,sans-serif" font-size="11" fill="#374151">Looks great! 👍</text>
  <text x="1010" y="354" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="#6B7280">System</text>
  <text x="1010" y="370" font-family="Arial,sans-serif" font-size="11" fill="#374151">Tejaswini raised hand ✋</text>

  <!-- Footer -->
  <rect y="690" width="1280" height="30" fill="#0A1628"/>
  <text x="640" y="710" font-family="Arial,sans-serif" font-size="11" fill="#7a93b8" text-anchor="middle">🔵 ConnectSphere · Collaborative Whiteboard · Real-time Sync via Socket.IO</text>
</svg>
