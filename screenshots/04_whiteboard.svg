  <text x="40" y="114" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#0F1824">🎨 Collaborative Whiteboard</text>
  <!-- Color picker -->
  <rect x="740" y="96" width="36" height="34" rx="7" fill="#1A56DB" stroke="#E5E7EB" stroke-width="1.5"/>
  <!-- Size range -->
  <rect x="790" y="106" width="80" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="790" y="106" width="30" height="8" rx="4" fill="#1A56DB"/>
  <circle cx="820" cy="110" r="7" fill="white" stroke="#1A56DB" stroke-width="2"/>
