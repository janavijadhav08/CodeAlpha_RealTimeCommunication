<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="hdr4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A1628"/><stop offset="100%" style="stop-color:#1A56DB"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <!-- Header -->
  <rect width="1280" height="64" fill="url(#hdr4)"/>
  <circle cx="30" cy="32" r="10" fill="#3b82f6"/>
  <text x="48" y="38" font-family="Arial Black,sans-serif" font-weight="900" font-size="20" fill="white">ConnectSphere</text>
  <rect x="600" y="20" width="140" height="26" rx="13" fill="rgba(255,255,255,0.1)"/>
  <text x="670" y="37" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="#ffd700" text-anchor="middle">📍 dev-team-01</text>

  <!-- Whiteboard card -->
  <rect x="20" y="80" width="940" height="560" rx="14" fill="white" stroke="#E5E7EB" stroke-width="1"/>
