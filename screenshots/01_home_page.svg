  <rect x="690" y="80" width="480" height="38" rx="16" fill="#1a2340"/>
  <rect x="690" y="98" width="480" height="20" fill="#1a2340"/>
  <circle cx="712" cy="99" r="6" fill="#EF4444"/>
  <circle cx="732" cy="99" r="6" fill="#F59E0B"/>
  <circle cx="752" cy="99" r="6" fill="#10B981"/>
  <rect x="790" y="90" width="260" height="18" rx="9" fill="rgba(255,255,255,0.08)"/>
  <text x="920" y="103" font-family="monospace" font-size="10" fill="#aaa" text-anchor="middle">connectsphere.app/dev-team-01</text>

  <!-- Video grid 2x2 -->
  <!-- JJ -->
  <rect x="698" y="126" width="224" height="168" rx="10" fill="url(#mock1)"/>
  <circle cx="810" cy="192" r="28" fill="rgba(255,255,255,0.25)"/>
  <text x="810" y="200" font-family="Arial Black,sans-serif" font-weight="900" font-size="16" fill="white" text-anchor="middle">JJ</text>
  <text x="810" y="276" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">Janavi Jadhav</text>
  <!-- KT -->
  <rect x="930" y="126" width="232" height="168" rx="10" fill="url(#mock2)"/>
