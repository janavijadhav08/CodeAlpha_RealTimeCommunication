  <!-- Background -->
  <rect width="1280" height="720" fill="#F8FAFC"/>

  <!-- Header -->
  <rect width="1280" height="64" fill="url(#hdr)"/>
  <rect y="61" width="1280" height="3" fill="#1A56DB"/>
  <!-- Brand -->
  <circle cx="30" cy="32" r="10" fill="#3b82f6"/>
  <text x="48" y="38" font-family="Arial Black,sans-serif" font-weight="900" font-size="20" fill="white">ConnectSphere</text>
  <rect x="206" y="22" width="30" height="18" rx="9" fill="#1A56DB"/>
  <text x="221" y="35" font-family="Arial,sans-serif" font-weight="700" font-size="9" fill="white" text-anchor="middle">PRO</text>
  <!-- Nav Login button -->
  <rect x="1150" y="18" width="110" height="30" rx="8" fill="url(#btn)"/>
  <text x="1205" y="38" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="white" text-anchor="middle">🔑 Login</text>

  <!-- Hero Left -->
  <!-- Badge -->
  <rect x="60" y="90" width="230" height="28" rx="14" fill="#EEF4FF" stroke="#1A56DB" stroke-width="1.5"/>
  <circle cx="80" cy="104" r="5" fill="#1A56DB"/>
  <text x="92" y="109" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="#1348C8">✦  Real-Time Collaboration Platform</text>

  <!-- Hero Title -->
  <text x="60" y="160" font-family="Arial Black,sans-serif" font-weight="900" font-size="44" fill="#0F1824">Connect. Collaborate.</text>
  <text x="60" y="215" font-family="Arial Black,sans-serif" font-weight="900" font-size="44" fill="#1A56DB">Get Things Done.</text>

  <!-- Subtitle -->
  <text x="60" y="260" font-family="Arial,sans-serif" font-size="14" fill="#374151">Professional video meetings with HD calls, screen sharing,</text>
  <text x="60" y="280" font-family="Arial,sans-serif" font-size="14" fill="#374151">live chat, file transfer and collaborative whiteboard.</text>
  <text x="60" y="300" font-family="Arial,sans-serif" font-size="14" fill="#374151">All in your browser. No downloads needed.</text>

  <!-- Stats -->
  <text x="60" y="360" font-family="Arial Black,sans-serif" font-weight="900" font-size="26" fill="#1A56DB">10K+</text>
  <text x="60" y="380" font-family="Arial,sans-serif" font-size="10" fill="#6B7280" letter-spacing="1">ACTIVE USERS</text>
  <rect x="130" y="345" width="1" height="40" fill="#E5E7EB"/>
  <text x="145" y="360" font-family="Arial Black,sans-serif" font-weight="900" font-size="26" fill="#1A56DB">500+</text>
  <text x="145" y="380" font-family="Arial,sans-serif" font-size="10" fill="#6B7280" letter-spacing="1">DAILY MEETINGS</text>
  <rect x="230" y="345" width="1" height="40" fill="#E5E7EB"/>
  <text x="245" y="360" font-family="Arial Black,sans-serif" font-weight="900" font-size="26" fill="#1A56DB">99.9%</text>
  <text x="245" y="380" font-family="Arial,sans-serif" font-size="10" fill="#6B7280" letter-spacing="1">UPTIME</text>

