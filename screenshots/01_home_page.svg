  <text x="1046" y="200" font-family="Arial Black,sans-serif" font-weight="900" font-size="16" fill="white" text-anchor="middle">KT</text>
  <text x="1046" y="276" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">Kajal Tiwari</text>
  <!-- TI -->
  <rect x="698" y="302" width="224" height="80" rx="10" fill="url(#mock3)"/>
  <circle cx="810" cy="335" r="18" fill="rgba(255,255,255,0.25)"/>
  <text x="810" y="341" font-family="Arial Black,sans-serif" font-weight="900" font-size="11" fill="white" text-anchor="middle">TI</text>
  <text x="810" y="372" font-family="Arial,sans-serif" font-weight="700" font-size="10" fill="rgba(255,255,255,0.9)" text-anchor="middle">Tejaswini Ingle</text>
  <!-- RN -->
  <rect x="930" y="302" width="232" height="80" rx="10" fill="url(#mock4)"/>
  <circle cx="1046" cy="335" r="18" fill="rgba(255,255,255,0.25)"/>
  <text x="1046" y="341" font-family="Arial Black,sans-serif" font-weight="900" font-size="11" fill="white" text-anchor="middle">RN</text>
  <text x="1046" y="372" font-family="Arial,sans-serif" font-weight="700" font-size="10" fill="rgba(255,255,255,0.9)" text-anchor="middle">Reena N.</text>

  <!-- Mock controls -->
  <rect x="690" y="390" width="480" height="38" rx="0" fill="#0d1526"/>
  <rect x="690" y="390" width="480" height="38" fill="#0d1526"/>
  <rect x="690" y="410" width="480" height="18" fill="#0d1526"/>
  <rect x="800" y="395" width="34" height="28" rx="7" fill="rgba(255,255,255,0.1)"/>
  <text x="817" y="414" font-size="14" text-anchor="middle">🎙️</text>
  <rect x="844" y="395" width="34" height="28" rx="7" fill="rgba(255,255,255,0.1)"/>
  <text x="861" y="414" font-size="14" text-anchor="middle">📷</text>
  <rect x="888" y="395" width="34" height="28" rx="7" fill="rgba(255,255,255,0.1)"/>
  <text x="905" y="414" font-size="14" text-anchor="middle">🖥️</text>
  <rect x="932" y="395" width="34" height="28" rx="7" fill="rgba(185,28,28,0.3)"/>
  <text x="949" y="414" font-size="14" text-anchor="middle">🚪</text>

  <!-- Floating badges -->
  <rect x="1100" y="62" width="130" height="34" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="1100" y="62" width="4" height="34" rx="2" fill="#1A56DB"/>
  <text x="1114" y="84" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="#0F1824">💬 Chat Active</text>

  <rect x="1116" y="290" width="145" height="34" rx="10" fill="white"/>
  <rect x="1116" y="290" width="4" height="34" rx="2" fill="#047857"/>
  <text x="1130" y="312" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="#0F1824">📎 File Shared</text>

  <rect x="700" y="438" width="145" height="34" rx="10" fill="white"/>
  <rect x="700" y="438" width="4" height="34" rx="2" fill="#7C3AED"/>
  <text x="714" y="460" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="#0F1824">✋ Hand Raised</text>

  <!-- Join Card -->
  <rect x="60" y="430" width="600" height="160" rx="16" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="60" y="430" width="600" height="4" rx="2" fill="#1A56DB"/>
  <!-- Icon -->
  <rect x="80" y="450" width="52" height="52" rx="13" fill="url(#btn)"/>
  <text x="106" y="483" font-size="22" text-anchor="middle">🎥</text>
  <!-- Text -->
  <text x="148" y="470" font-family="Arial Black,sans-serif" font-weight="800" font-size="16" fill="#0F1824">Join a Meeting</text>
  <text x="148" y="488" font-family="Arial,sans-serif" font-size="12" fill="#6B7280">Enter your name and room code to start collaborating</text>
  <!-- Input fields -->
  <rect x="80" y="510" width="260" height="38" rx="9" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="96" y="534" font-family="Arial,sans-serif" font-size="13" fill="#9CA3AF">e.g. Janavi Jadhav</text>
  <rect x="356" y="510" width="284" height="38" rx="9" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="372" y="534" font-family="Arial,sans-serif" font-size="13" fill="#9CA3AF">e.g. dev-team-01</text>
  <!-- Buttons -->
  <rect x="80" y="558" width="150" height="38" rx="11" fill="url(#btn)"/>
  <text x="155" y="582" font-family="Arial,sans-serif" font-weight="800" font-size="13" fill="white" text-anchor="middle">🎥 Join Meeting</text>
  <rect x="244" y="558" width="130" height="38" rx="11" fill="white" stroke="#1A56DB" stroke-width="2"/>
  <text x="309" y="582" font-family="Arial,sans-serif" font-weight="800" font-size="13" fill="#1A56DB" text-anchor="middle">⚡ Quick Room</text>

  <!-- Footer strip -->
  <rect y="690" width="1280" height="30" fill="#0A1628"/>
  <text x="640" y="710" font-family="Arial,sans-serif" font-size="11" fill="#7a93b8" text-anchor="middle">🔵 ConnectSphere · Professional Video Meeting Platform · CodeAlpha Full Stack Internship</text>
